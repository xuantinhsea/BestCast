name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a queued run waits rather than racing the one in flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Turns Pages on for the repo when the workflow token is allowed to do
      # so, which saves a trip to Settings on a fresh fork.
      #
      # Non-fatal on purpose: creating a Pages site needs admin rights the
      # default GITHUB_TOKEN does not always carry, and when it is refused this
      # step took the whole build down with it — lint, build and the artifact
      # upload were all skipped over a step whose output nothing here consumes
      # (VITE_BASE_PATH is set below). Let it fail; if Pages genuinely is not
      # enabled, the deploy job says so on its own, which is the honest place
      # for that to surface.
      - uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          # Pages serves the site from /<repo>/, and the PWA manifest's
          # start_url and scope are derived from this. Taken from the repository
          # name rather than written out, so renaming the repo cannot leave a
          # stale path here that breaks every asset URL. Vercel serves from the
          # domain root and leaves it unset.
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
